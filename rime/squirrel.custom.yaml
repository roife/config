# squirrel.custom.yaml
# 按 ~/conf-rime/squirrel.yaml 的偏好改写（不含主题皮肤），转写为 patch 形式。
# 修改后需「重新部署」生效。

patch:
  app_options:
    com.apple.Spotlight:
      ascii_mode: true
    org.gnu.Emacs:
      ascii_mode: true
      no_inline: true

  style:
    text_orientation: horizontal
    candidate_list_layout: linear
    candidate_format: "%c %@"
    inline_preedit: true
    corner_radius: 6
    hilited_corner_radius: 0
    border_height: 0
    border_width: 0
    line_spacing: 5
    spacing: 10
    font_point: 18
    label_font_point: 15
    comment_font_point: 15
