patch:
  # emoji 开关默认开启（index 4 = emoji 开关，states[1]=😄）
  switches/@4/reset: 1
  # 移除 is_in_user_dict 过滤器：不再给候选加 *（用户词典）和 ∞（整句联想）标记
  engine/filters/@0: null
  # 当前 librime-lua 会自行回收；省去 force_gc 的额外调用和空翻译器。
  # 保留所有功能翻译器及其原有顺序。
  engine/translators:
    - punct_translator
    - table_translator@frost_aux
    - script_translator
    - lua_translator@*date_translator
    - lua_translator@*lunar
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - table_translator@radical_lookup
    - lua_translator@*unicode
    - lua_translator@*number_translator
    - lua_translator@*calculator
  grammar:
    language: wanxiang-lts-zh-hans   # 万象 LTS 简体，wanxiang-lts-zh-hans.gram
    non_collocation_penalty: -4
    collocation_max_length: 5
    collocation_min_length: 2
    collocation_penalty: -14
  translator/contextual_suggestions: true  # 使用语言模型优化整句输出
  translator/dictionary: rime_frost_simplified.custom
  translator/max_homophones: 6
  translator/max_homographs: 2
  radical_reverse_lookup/dictionary: rime_frost_simplified.custom
  custom_phrase/user_dict: private_phrase
  # 中文半角模式下直接上屏 /，不再显示 /、÷ 候选菜单
  "punctuator/half_shape":
    __include: default:/punctuator/half_shape
    "/": "/"
