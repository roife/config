# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: llvm
    repo_name: llvm-project
    description: The LLVM compiler infrastructure project
    version_prefix: llvmorg-
    asset: LLVM-{{.SemVer}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.xz
    replacements:
      darwin: macOS
      linux: Linux
      arm64: ARM64
      amd64: X64
    files:
      - name: clang
        src: LLVM-{{.SemVer}}-{{.OS}}-{{.Arch}}/bin/clang
    supported_envs:
      - darwin/arm64
      - linux/arm64
      - linux/amd64
