[settings]
lockfile = true
aqua.registries = [".config/mise/aqua-registry.yaml"]

[tools]
# Languages and toolchains
node = "lts"
rust = ["stable", "nightly"]
java = ["26", "21"]
"aqua:llvm/llvm-project" = "22.1.8"

# Build and code intelligence
"aqua:Kitware/CMake" = "latest"
"github:ninja-build/ninja" = "latest"
"github:tree-sitter/tree-sitter" = "latest"
"conda:universal-ctags" = "latest"
"conda:tokei" = "latest"
"conda:jdtls" = "latest"
"github:pest-parser/pest-ide-tools" = "latest"

# Python tooling
"github:astral-sh/uv" = "latest"
"pipx:ruff" = { version = "latest", uvx_args = "--no-build", depends = "github:astral-sh/uv" }
"pipx:pyrefly" = { version = "latest", uvx_args = "--no-build", depends = "github:astral-sh/uv" }

# Version control
"github:cli/cli" = "latest"
"github:git-lfs/git-lfs" = "latest"
"github:Wilfred/difftastic" = "latest"
"github:direnv/direnv" = { version = "latest", bin = "direnv" }
"github:BurntSushi/ripgrep" = "latest"
"github:sharkdp/fd" = "latest"
"conda:wget" = "latest"
"github:tealdeer-rs/tealdeer" = { version = "latest", bin = "tldr" }

# Documents and diagrams
"github:jgm/pandoc" = "latest"
"conda:graphviz" = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"

# Typst
"github:typst/typst" = "latest"
"github:Myriad-Dreamin/tinymist" = "latest"

# Media
"conda:exiftool" = "latest"
"conda:ffmpeg" = "latest"
"conda:imagemagick" = "latest"
"pipx:yt-dlp" = { version = "latest", extras = "default", uvx_args = "--no-build", depends = "github:astral-sh/uv" }

# AI
"npm:@openai/codex" = "latest"

[env]
JAVA21_HOME = { value = "{{ [java.path for java in tools.java if java.version is starting_with(pat='21.')] | first }}", tools = true }
JAVA26_HOME = { value = "{{ [java.path for java in tools.java if java.version is starting_with(pat='26.')] | first }}", tools = true }
JDTLS_JAVA_HOME = { value = "{{ env.JAVA21_HOME }}", tools = true }
